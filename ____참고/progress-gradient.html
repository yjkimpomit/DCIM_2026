<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그라디언트 진행률 차트</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #224575;
      color: #e6edf7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; }
    .progress-list { max-width: 760px; margin: 0 auto; display: grid; gap: 26px; }
    .progress-item {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr) 60px;
      gap: 16px;
      align-items: center;
      --progress-gradient: linear-gradient(180deg, #eef2f6 30%, #c9d3df 80%, #8f9eaf 100%);
    }
    .progress-item[data-type="total"] {
      --progress-gradient: linear-gradient(180deg, #e5ff8a 30%, #d1ff47 80%, #a5db04 100%);
    }
    .progress-item[data-type="system"] {
      --progress-gradient: linear-gradient(180deg, #bdf3ff 30%, #74e3ff 80%, #22bbdd 100%);
    }
    .progress-item__label, .progress-item__value { font-size: 22px; font-weight: 700; line-height: 1.2; }
    .progress-item__value { text-align: right; font-variant-numeric: tabular-nums; }
    .progress-item__track { background: #091326; border-radius: 999px; height: 16px; overflow: hidden; }
    .progress-item__fill { display: block; height: 100%; width: var(--value); background: var(--progress-gradient); border-radius: inherit; }
    @media (min-width: 768px) {
      body { padding: 32px 16px; }
      .progress-item { grid-template-columns: 146px minmax(0, 1fr) 88px; gap: 16px; }
      .progress-item__label, .progress-item__value { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="progress-list" aria-label="항목별 진행률">
    <div class="progress-item" data-type="total" style="--value: 10%">
      <span class="progress-item__label" id="label-total">TOTAL</span>
      <div class="progress-item__track" role="progressbar" aria-labelledby="label-total" aria-valuemin="0" aria-valuemax="100" aria-valuenow="10">
        <span class="progress-item__fill"></span>
      </div>
      <span class="progress-item__value" aria-hidden="true">10%</span>
    </div>
    <div class="progress-item" data-type="system" style="--value: 5%">
      <span class="progress-item__label" id="label-system">SYSTEM</span>
      <div class="progress-item__track" role="progressbar" aria-labelledby="label-system" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5">
        <span class="progress-item__fill"></span>
      </div>
      <span class="progress-item__value" aria-hidden="true">5%</span>
    </div>
    <div class="progress-item" data-type="server" style="--value: 20%">
      <span class="progress-item__label" id="label-server">SERVER</span>
      <div class="progress-item__track" role="progressbar" aria-labelledby="label-server" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
        <span class="progress-item__fill"></span>
      </div>
      <span class="progress-item__value" aria-hidden="true">20%</span>
    </div>
  </div>
</body>
</html>
